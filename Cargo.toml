[package]
edition      = "2024"
name         = "reader-server-rs"
rust-version = "1.85"
version      = "0.1.0"

[dependencies]
anyhow             = "1.0"
argon2             = { version = "0.5" }
axum               = { version = "0.8.3", features = ["multipart"] }
axum-extra         = { version = "0.12.1", features = ["typed-header"] }
bytes              = "1.12"
chrono             = { version = "0.4", features = ["serde"] }
color-eyre         = "0.6"
epub               = "2.0"
fancy-regex        = "0.18"
http-body-util     = "0.1.3"
infer              = "0.16"
jsonwebtoken       = { version = "10.3", features = ["rust_crypto"] }
rand               = "0.10"
regex              = "1.12"
scraper            = "0.27"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
sqlx               = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "migrate", "macros", "derive", "uuid"] }
thiserror          = "2.0"
tokio              = { version = "1", features = ["full"] }
tower              = "0.5.2"
tower-http         = { version = "0.7.0", features = ["cors", "trace", "compression-gzip"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid               = { version = "1.23", features = ["v4"] }

[dev-dependencies]

[build-dependencies]
fuck-backslash  = "0.1.0"
path-absolutize = "3.1.1"
sqlx            = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
tokio           = { version = "1", features = ["full"] }

[[bin]]
name = "reader-server"
path = "src/main.rs"

[profile.release]
lto       = true
opt-level = "s"
panic     = "abort"
strip     = true
